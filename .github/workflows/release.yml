name: Release desktop app

permissions:
  contents: write

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            script: dist:mac
            pattern: desktop/release/*.dmg
          - os: ubuntu-22.04
            script: dist:linux
            pattern: desktop/release/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build -w ui && npm run build -w server
      - run: npm run ${{ matrix.script }} -w desktop
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error

  # One job publishes, after every build finished — concurrent uploads to the same release hang.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with: { path: installers, merge-multiple: true }
      - run: ls -la installers
      - name: Publish release with gh (reliable for large assets)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "AgentGrid ${TAG#v}" --generate-notes
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" installers/* --clobber
